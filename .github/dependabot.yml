version: 2

updates:
  - package-ecosystem: npm
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Dhaka"

    target-branch: main
    open-pull-requests-limit: 5
    versioning-strategy: increase

    labels:
      - dependencies

    commit-message:
      prefix: deps
      include: scope

    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Asia/Dhaka"

    target-branch: main
    open-pull-requests-limit: 5

    labels:
      - dependencies

    commit-message:
      prefix: ci
      include: scope

    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch